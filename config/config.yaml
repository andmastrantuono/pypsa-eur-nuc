snapshots:
  start: "2013-01-01"
  end: "2014-01-01"

enable:
  retrieve: false
  retrieve_databundle: false
  retrieve_cost_data: false   # Mantiene i tuoi costi modificati
  build_cutout: false
  retrieve_cutout: false


clustering: 
  mode: administrative  
  administrative:
    #level: 0  
    IT: 1  
    AT: 0
    CH: 0
    FR: 0
    GR: 0
    ME: 0
    SI: 0
  temporal:
    resolution_elec: 24

countries:
- IT
- AT
- CH
- FR
- GR
- ME
- SI

#scenario:
#  clusters:
#    - 6

electricity:
  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT, nuclear_epr, nuclear_smr]

modular_expansion:
  nuclear_epr: 1650  # Taglia del modulo in MW
  nuclear_smr: 470

sector:
  transport: false
  heating: false
  biomass: false
  industry: false
  shipping: false
  aviation: false
  agriculture: false
  fossil_fuels: false

solving:
  solver:
    name: gurobi
    options: gurobi-milp

  solver_options:
    gurobi-milp:
      Method: 2
      Crossover: 0        # Ignorato per il root MILP, ma utile tenerlo per altro
      MIPGap: 0.05        # Rilassato al 5% per velocizzare il MILP
      NumericFocus: 2     # RISOLVE il loop del Markowitz e del Crossover
      MIPFocus: 1         # FORZA Gurobi a cercare soluzioni intere veloci
      Cuts: 0             # NOVITÀ: Spegne i piani di taglio (evita il blocco di 2 ore)
      Heuristics: 0       # NOVITÀ: Evita che perda ore a "indovinare" la soluzione